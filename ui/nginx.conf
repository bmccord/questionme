server {
    listen 3300;
    server_name _;
    root /usr/share/nginx/html;

    # The API is a sibling container. Keeping it behind the same origin means
    # one hostname, one tunnel route, and no CORS or third-party cookie
    # questions for the admin session.
    location /api/ {
        proxy_pass         http://api:4300;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz { proxy_pass http://api:4300/healthz; }
    location = /readyz  { proxy_pass http://api:4300/readyz; }

    # Angular routing: every unknown path is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
